<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Downloader — Dependency Map</title>
<link rel="stylesheet" href="/css/dependency-map.css">
<style>
  :root {
    --accent-a: #00e5ff; /* entry */
    --accent-b: #b388ff; /* ui */
    --accent-c: #ffb300; /* core */
    --accent-d: #00e676; /* service */
    --accent-e: #ff4d6d; /* system */
    --accent-f: #448aff; /* external */
  }
  .logo { color: var(--accent-e); }
  .ctrl-btn:hover { border-color: var(--accent-e); color: var(--accent-e); }
</style>
</head>
<body>

<header>
  <div><span class="logo">Video Downloader <span>— Architecture Dependency Map</span></span></div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-a)"></div> Entry</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-b)"></div> UI / XAML</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-c)"></div> C# Core</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-d)"></div> Services</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-e)"></div> System</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-f)"></div> External</div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-reset" type="button">↺ Reset</button>
    <button class="ctrl-btn" id="btn-zoom-in" type="button">+ Zoom</button>
    <button class="ctrl-btn" id="btn-zoom-out" type="button">− Zoom</button>
  </div>
</header>

<div id="canvas-wrap">
  <canvas id="graph-canvas"></canvas>
  <div id="nodes-layer"></div>
</div>

<div id="info-panel">
  <button id="info-close" type="button" aria-label="Close">✕</button>
  <h3 id="ip-title">—</h3>
  <p id="ip-desc">—</p>
  <div class="deps-list" id="ip-deps"></div>
</div>

<div id="hint">
  🖱 Drag to pan &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click node for details
</div>

<div id="mobile-hint">
  Drag to pan · Pinch to zoom · Tap a node for details
</div>

<script src="/js/dependency-map-engine.js"></script>
<script>
const nodes = [
  // Entry
  { id: 'app_xaml', x: 500, y: 110, layer: 'a', icon: '⚡', title: 'App.xaml', sub: 'WPF Application root\nApp lifecycle & startup', tag: 'C# Entry',
    desc: 'Application entry point. Defines the WPF Application class, sets startup URI to InitWindow, and manages global application lifecycle events (startup, exit, unhandled exceptions).',
    deps: ['app_xaml_cs', 'init_window'] },

  { id: 'app_xaml_cs', x: 500, y: 260, layer: 'c', icon: '⚙️', title: 'App.xaml.cs', sub: 'App bootstrap logic\nGlobal state init', tag: 'C# Backend',
    desc: 'Code-behind for App.xaml. Initializes global application state, wires up unhandled exception handlers, and bootstraps the DataAccessor and preferences system on launch.',
    deps: ['data_accessor', 'preferences'] },

  // UI Layer
  { id: 'init_window', x: 220, y: 260, layer: 'b', icon: '🚀', title: 'InitWindow.xaml', sub: 'Splash / dependency check\nyt-dlp & ffmpeg verify', tag: 'WPF Window',
    desc: 'Startup splash window. Verifies that yt-dlp.exe and ffmpeg.exe are present in the Dependencies folder. Shows loading status and transitions to MainWindow once ready.',
    deps: ['init_window_cs', 'wpf_core'] },

  { id: 'init_window_cs', x: 80, y: 420, layer: 'c', icon: '⚙️', title: 'InitWindow.xaml.cs', sub: 'Dependency validation\nLaunch handoff', tag: 'C# Backend',
    desc: 'Code-behind for InitWindow. Checks file existence of yt-dlp.exe and ffmpeg.exe, optionally downloads them if missing, then instantiates and shows MainWindow.',
    deps: ['main_window', 'yt_dlp', 'ffmpeg'] },

  { id: 'main_window', x: 500, y: 420, layer: 'b', icon: '🪟', title: 'MainWindow.xaml', sub: 'Primary UI\nURL input · Download btn', tag: 'WPF Window',
    desc: 'Main application window. Contains the URL text field, format selector (video/audio), quality options, download button, progress bar, and status label. The primary user-facing surface.',
    deps: ['main_window_cs', 'wpf_core'] },

  { id: 'main_window_cs', x: 500, y: 580, layer: 'c', icon: '⚙️', title: 'MainWindow.xaml.cs', sub: 'Download orchestration\nProgress tracking', tag: 'C# Backend',
    desc: 'Code-behind for MainWindow. Handles user input, triggers download via YoutubeDLSharp wrapper, wires progress events to the UI progress bar, and manages cancellation tokens.',
    deps: ['data_accessor', 'ytdlsharp', 'profile_window'] },

  { id: 'profile_window', x: 780, y: 420, layer: 'b', icon: '👤', title: 'Profile.xaml', sub: 'User preferences UI\nOutput path · format defaults', tag: 'WPF Window',
    desc: 'Profile/settings window. Lets the user configure default download directory, preferred format (MP4/WebM/MP3), video quality, and other persistent preferences.',
    deps: ['profile_window_cs', 'wpf_core'] },

  { id: 'profile_window_cs', x: 780, y: 580, layer: 'c', icon: '⚙️', title: 'Profile.xaml.cs', sub: 'Settings read/write\nPreferences persistence', tag: 'C# Backend',
    desc: 'Code-behind for Profile window. Reads and writes user preferences to preferences.json via DataAccessor. Applies settings changes immediately on save.',
    deps: ['data_accessor', 'preferences'] },

  { id: 'error_window', x: 1000, y: 420, layer: 'b', icon: '🔴', title: 'Error.xaml', sub: 'Error display\nStack trace · Dismiss', tag: 'WPF Window',
    desc: 'Error dialog window. Surfaces runtime errors and download failures to the user with a readable message and optional stack trace detail. Supports dismiss and retry actions.',
    deps: ['error_window_cs', 'wpf_core'] },

  { id: 'error_window_cs', x: 1000, y: 580, layer: 'c', icon: '⚙️', title: 'Error.xaml.cs', sub: 'Error context binding\nEvent relay', tag: 'C# Backend',
    desc: 'Code-behind for Error window. Receives error context from MainWindow or DataAccessor and binds it to the XAML view for display.',
    deps: ['data_accessor'] },

  // Core / Service Layer
  { id: 'data_accessor', x: 500, y: 760, layer: 'c', icon: '🗄', title: 'DataAccessor.cs', sub: 'Download API facade\nJSON · file I/O', tag: 'C# Core',
    desc: 'Central service class. Wraps YoutubeDLSharp calls, handles format selection, manages output path resolution, reads/writes preferences.json via Newtonsoft.Json, and emits progress events.',
    deps: ['ytdlsharp', 'newtonsoft', 'preferences'] },

  { id: 'preferences', x: 270, y: 760, layer: 'd', icon: '📋', title: 'preferences.json', sub: 'Output path · quality\nFormat defaults', tag: 'User Data',
    desc: 'Persisted user preferences file stored in the UserPreferences folder alongside the binary. Contains default output directory, preferred format, quality level, and other settings. Serialized/deserialized with Newtonsoft.Json.',
    deps: ['newtonsoft'] },

  // Service Layer
  { id: 'ytdlsharp', x: 500, y: 950, layer: 'd', icon: '📡', title: 'YoutubeDLSharp', sub: '.NET wrapper for yt-dlp\nAsync download API', tag: 'NuGet Package',
    desc: 'YoutubeDLSharp.dll — a .NET wrapper library for yt-dlp. Provides async download methods, format option structs, progress reporting via IProgress<T>, and process management for the yt-dlp subprocess.',
    deps: ['yt_dlp'] },

  { id: 'newtonsoft', x: 270, y: 950, layer: 'f', icon: '{}', title: 'Newtonsoft.Json', sub: 'JSON serialization\nPreferences R/W', tag: 'NuGet Package',
    desc: 'Newtonsoft.Json.dll — industry-standard JSON library. Used by DataAccessor to serialize and deserialize the preferences.json file and parse any API or metadata responses.',
    deps: [] },

  // External CLI tools
  { id: 'yt_dlp', x: 400, y: 1120, layer: 'f', icon: '▶️', title: 'yt-dlp.exe', sub: 'YouTube metadata & stream\nextract + download', tag: 'External Binary',
    desc: 'yt-dlp.exe — powerful open-source YouTube download engine. Invoked as a subprocess by YoutubeDLSharp. Handles URL parsing, format selection, stream fetching, and passes raw video/audio data to ffmpeg for muxing.',
    deps: ['ffmpeg'] },

  { id: 'ffmpeg', x: 620, y: 1120, layer: 'f', icon: '🎞', title: 'ffmpeg.exe', sub: 'Audio/video muxing\nFormat conversion', tag: 'External Binary',
    desc: 'ffmpeg.exe — multimedia processing engine. Used by yt-dlp to merge separate video and audio streams into the final output file and to transcode to requested formats (MP3, MP4, WebM, etc.).',
    deps: [] },

  // System / Build
  { id: 'wpf_core', x: 130, y: 760, layer: 'e', icon: '🖼', title: 'WPF / .NET 9', sub: 'XAML rendering engine\nData binding · controls', tag: '.NET 9 Framework',
    desc: 'Windows Presentation Foundation on .NET 9.0. Provides the XAML parser, dependency property system, data binding, layout engine, and built-in controls (TextBox, Button, ProgressBar, etc.).',
    deps: ['dotnet_runtime'] },

  { id: 'dotnet_runtime', x: 130, y: 950, layer: 'e', icon: '🔩', title: '.NET Runtime', sub: 'CLR · GC · P/Invoke\nSelf-contained publish', tag: '.NET 9',
    desc: 'The .NET 9 Common Language Runtime. Provides JIT compilation, garbage collection, async/await infrastructure, and P/Invoke for native interop. Published as self-contained (SelfContained=true) for zero-dependency distribution.',
    deps: [] },

  { id: 'build_tools', x: 870, y: 760, layer: 'e', icon: '🛠', title: 'Build & Deploy', sub: 'dotnet publish · R2R\nAdvanced Installer', tag: 'Tooling',
    desc: 'Build pipeline using dotnet publish with win-x64/win-x86 targets, ReadyToRun (R2R) compilation for startup perf, single-file packaging, and Advanced Installer for the .exe setup wizard. Git LFS manages binary assets.',
    deps: [] },

  { id: 'assemblyinfo', x: 1000, y: 260, layer: 'e', icon: '📄', title: 'AssemblyInfo.cs', sub: 'Version · metadata\nProduct info', tag: 'Build Artifact',
    desc: 'Assembly metadata file. Defines AssemblyVersion, FileVersion, product name ("Video Downloader"), company, copyright, and GUID. Consumed by the build system and installer.',
    deps: [] },
];

const edges = [
  { from: 'app_xaml',          to: 'app_xaml_cs' },
  { from: 'app_xaml',          to: 'init_window' },
  { from: 'app_xaml_cs',       to: 'data_accessor' },
  { from: 'app_xaml_cs',       to: 'preferences' },
  { from: 'init_window',       to: 'init_window_cs' },
  { from: 'init_window',       to: 'wpf_core' },
  { from: 'init_window_cs',    to: 'main_window' },
  { from: 'init_window_cs',    to: 'yt_dlp' },
  { from: 'init_window_cs',    to: 'ffmpeg' },
  { from: 'main_window',       to: 'main_window_cs' },
  { from: 'main_window',       to: 'wpf_core' },
  { from: 'main_window_cs',    to: 'data_accessor' },
  { from: 'main_window_cs',    to: 'ytdlsharp' },
  { from: 'main_window_cs',    to: 'profile_window' },
  { from: 'profile_window',    to: 'profile_window_cs' },
  { from: 'profile_window',    to: 'wpf_core' },
  { from: 'profile_window_cs', to: 'data_accessor' },
  { from: 'profile_window_cs', to: 'preferences' },
  { from: 'error_window',      to: 'error_window_cs' },
  { from: 'error_window',      to: 'wpf_core' },
  { from: 'error_window_cs',   to: 'data_accessor' },
  { from: 'data_accessor',     to: 'ytdlsharp' },
  { from: 'data_accessor',     to: 'newtonsoft' },
  { from: 'data_accessor',     to: 'preferences' },
  { from: 'preferences',       to: 'newtonsoft' },
  { from: 'ytdlsharp',         to: 'yt_dlp' },
  { from: 'yt_dlp',            to: 'ffmpeg' },
  { from: 'wpf_core',          to: 'dotnet_runtime' },
  { from: 'main_window_cs',    to: 'error_window' },
  { from: 'build_tools',       to: 'dotnet_runtime' },
];

const layerColors = {
  a: getComputedStyle(document.documentElement).getPropertyValue('--accent-a').trim(),
  b: getComputedStyle(document.documentElement).getPropertyValue('--accent-b').trim(),
  c: getComputedStyle(document.documentElement).getPropertyValue('--accent-c').trim(),
  d: getComputedStyle(document.documentElement).getPropertyValue('--accent-d').trim(),
  e: getComputedStyle(document.documentElement).getPropertyValue('--accent-e').trim(),
  f: getComputedStyle(document.documentElement).getPropertyValue('--accent-f').trim(),
};

DependencyMap.init({ nodes, edges, layerColors });
</script>
</body>
</html>
