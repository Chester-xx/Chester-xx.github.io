<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matrix Calculator — Dependency Map</title>
<link rel="stylesheet" href="/css/dependency-map.css">
<style>
  :root {
    --accent-a: #00e5ff; /* entry */
    --accent-b: #b388ff; /* ui */
    --accent-c: #ffb300; /* core */
    --accent-d: #00e676; /* runtime */
    --accent-e: #ff4d6d; /* compile path / system */
    --accent-f: #448aff; /* external libs */
  }
  .logo { color: var(--accent-d); }
  .ctrl-btn:hover { border-color: var(--accent-d); color: var(--accent-d); }
</style>
</head>
<body>

<header>
  <div><span class="logo">Matrix Calculator <span>— Architecture Dependency Map</span></span></div>
  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-a)"></div> Entry</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-b)"></div> UI Layer</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-c)"></div> Logic Core</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-d)"></div> Python Runtime</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-e)"></div> Compile Path</div>
    <div class="leg-item"><div class="leg-dot" style="color:var(--accent-f)"></div> External Libs</div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-reset" type="button">↺ Reset</button>
    <button class="ctrl-btn" id="btn-zoom-in" type="button">+ Zoom</button>
    <button class="ctrl-btn" id="btn-zoom-out" type="button">− Zoom</button>
  </div>
</header>

<div id="canvas-wrap">
  <canvas id="graph-canvas"></canvas>
  <div id="nodes-layer"></div>
</div>

<div id="info-panel">
  <button id="info-close" type="button" aria-label="Close">✕</button>
  <h3 id="ip-title">—</h3>
  <p id="ip-desc">—</p>
  <div class="deps-list" id="ip-deps"></div>
</div>

<div id="hint">
  🖱 Drag to pan &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click node for details
</div>

<div id="mobile-hint">
  Drag to pan · Pinch to zoom · Tap a node for details
</div>

<script src="/js/dependency-map-engine.js"></script>
<script>
const nodes = [
  // ── Entry / Perception Layer ──
  { id: 'gui_py', x: 500, y: 100, layer: 'a', icon: '⚡', title: 'GUI.py',
    sub: 'Application entry point\nLaunches CustomTkinter window', tag: 'Entry / Perception',
    desc: 'Primary entry point. Instantiates the CustomTkinter App class, defines all window widgets (grid entry fields, operation buttons, output box, clear button), and wires every button to an event handler. Imports Main.py for all computation. Run via `python GUI.py` or from an IDE.',
    deps: ['main_py', 'customtkinter', 'ctkmessagebox', 'python_runtime'] },

  // ── UI Layer ──
  { id: 'input_grid', x: 200, y: 280, layer: 'b', icon: '🔢', title: 'Input Grid',
    sub: '3×3 entry widgets (×2)\nMatrix A & Matrix B', tag: 'UI Component',
    desc: 'Two sets of 9 CTkEntry widgets forming the 3×3 input grids for Matrix A and Matrix B. Accepts integer and floating-point values. Event-driven — values are read on button press, not continuously polled.',
    deps: ['customtkinter'] },

  { id: 'op_buttons', x: 500, y: 280, layer: 'b', icon: '🎛', title: 'Operation Buttons',
    sub: 'Add · Sub · Mul · Det\nPower · Clear', tag: 'UI Component',
    desc: 'CTkButton instances for each supported operation: Addition, Subtraction, Multiplication, Determinant, Power. Each button is bound to a handler in GUI.py that reads inputs, calls the appropriate Main.py function, and writes the result to the output widget. Clear resets all entries to 0.',
    deps: ['customtkinter', 'ctkmessagebox'] },

  { id: 'output_box', x: 800, y: 280, layer: 'b', icon: '📤', title: 'Output Display',
    sub: 'CTkEntry result display\nFormatted matrix output', tag: 'UI Component',
    desc: 'A read-only CTkEntry (or label) widget that receives the formatted result string from GUI.py after computation. Displays the output matrix or scalar. A decimal formatter to 2 d.p. exists in code but is commented out to avoid obfuscating precise results.',
    deps: ['customtkinter'] },

  // ── Planning / Logic Core ──
  { id: 'main_py', x: 500, y: 470, layer: 'c', icon: '🧮', title: 'Main.py',
    sub: 'All matrix operations\nZero external math libs', tag: 'Logic Core / Planning',
    desc: 'Pure Python computation module — the "planning" layer. Implements all matrix operations from scratch with no external math libraries (no NumPy). Contains: add(), subtract(), multiply(), determinant() via cofactor expansion, power() via repeated multiplication. Receives parsed float inputs from GUI.py and returns result matrices or scalars.',
    deps: ['python_runtime'] },

  { id: 'op_add_sub', x: 200, y: 640, layer: 'c', icon: '➕', title: 'Add / Subtract',
    sub: 'Element-wise ops\nMatrix A ± Matrix B', tag: 'Matrix Op',
    desc: 'Element-wise addition and subtraction of two 3×3 matrices. Iterates rows and columns, summing or differencing corresponding elements. Returns a 3×3 result matrix.',
    deps: [] },

  { id: 'op_mul', x: 420, y: 640, layer: 'c', icon: '✖️', title: 'Multiply',
    sub: 'Dot product\nRow × Column accumulation', tag: 'Matrix Op',
    desc: 'Standard matrix multiplication via triple-nested loop (row i × col j dot product). Operates on 3×3 inputs, returns a 3×3 result. No broadcasting or shortcut algorithms — straightforward O(n³) implementation.',
    deps: [] },

  { id: 'op_det', x: 620, y: 640, layer: 'c', icon: '🔵', title: 'Determinant',
    sub: 'Cofactor expansion\nRecursive 3×3 formula', tag: 'Matrix Op',
    desc: 'Calculates the scalar determinant of a 3×3 matrix using cofactor (Laplace) expansion along the first row. Returns a single float value. Used independently and internally for potential future inverse support.',
    deps: [] },

  { id: 'op_power', x: 820, y: 640, layer: 'c', icon: '🔺', title: 'Power',
    sub: 'Matrix ^ n\nRepeated multiplication', tag: 'Matrix Op',
    desc: 'Raises a 3×3 matrix to an integer power n by performing repeated matrix multiplication (n−1 times). Power of 0 returns the identity matrix. Relies on the multiply() function internally.',
    deps: ['op_mul'] },

  { id: 'test_py', x: 1050, y: 470, layer: 'c', icon: '🧪', title: 'Test.py',
    sub: 'Dev scratch file\nNew code staging', tag: 'Dev Utility',
    desc: 'Standalone developer scratch file used to prototype and test new logic before integrating into Main.py or GUI.py. Has no connection to the running application and is not imported by any module. Included in the repo for transparency.',
    deps: ['python_runtime'] },

  // ── Python Runtime ──
  { id: 'python_runtime', x: 500, y: 840, layer: 'd', icon: '🐍', title: 'Python Interpreter',
    sub: 'CPython runtime\nBytecode compile → execute', tag: 'Python Runtime',
    desc: 'The CPython interpreter (e.g. from Microsoft Store or python.org). Parses and compiles GUI.py and Main.py to bytecode (.pyc), then executes via the Python Virtual Machine (PVM). Manages memory, the import system, and the event loop that drives the Tkinter/CustomTkinter UI.',
    deps: ['pvm', 'stdlib_tkinter'] },

  { id: 'pvm', x: 280, y: 1010, layer: 'd', icon: '⚙️', title: 'Python VM',
    sub: 'Bytecode execution\nGIL · memory · imports', tag: 'CPython PVM',
    desc: 'The CPython Virtual Machine executes compiled .pyc bytecode. Manages the Global Interpreter Lock (GIL), reference counting garbage collection, module import resolution, and the call stack. All Python logic in Main.py runs through the PVM.',
    deps: [] },

  { id: 'stdlib_tkinter', x: 720, y: 1010, layer: 'd', icon: '🖼', title: 'tkinter (stdlib)',
    sub: 'Tcl/Tk bridge\nWidget event loop', tag: 'Python Stdlib',
    desc: 'Python\'s built-in Tkinter module, part of the standard library. Wraps the Tcl/Tk GUI toolkit via C extension (_tkinter). CustomTkinter builds on top of Tkinter, theming its widgets. The Tkinter mainloop() drives the entire UI event system.',
    deps: [] },

  // ── External Libraries ──
  { id: 'customtkinter', x: 200, y: 470, layer: 'f', icon: '🎨', title: 'CustomTkinter',
    sub: 'Modern themed widgets\npip install customtkinter', tag: 'pip Package',
    desc: 'CustomTkinter (pip install customtkinter) — a modern, themeable UI library that wraps and extends Tkinter widgets. Provides CTkFrame, CTkEntry, CTkButton, CTkLabel with dark/light mode support and rounded styling. The entire GUI is built using CTk components.',
    deps: ['stdlib_tkinter'] },

  { id: 'ctkmessagebox', x: 800, y: 470, layer: 'f', icon: '💬', title: 'CTkMessagebox',
    sub: 'Styled dialog popups\npip install CTkMessagebox', tag: 'pip Package',
    desc: 'CTkMessagebox (pip install CTkMessagebox) — a CustomTkinter-compatible message dialog library. Used in GUI.py to display error messages (e.g. invalid input, non-square power operations) as styled popup dialogs rather than raw Tkinter messageboxes.',
    deps: ['customtkinter'] },

  // ── Compile Path (dashed — alternate execution route) ──
  { id: 'auto_py_to_exe', x: 1150, y: 280, layer: 'e', icon: '🔧', title: 'auto-py-to-exe',
    sub: 'PyInstaller GUI wrapper\nOne-folder / one-file build', tag: 'Build Tool',
    extra_class: 'compile-path',
    desc: 'auto-py-to-exe — a GUI front-end for PyInstaller. Lets the developer configure bundling options (one-file vs one-folder, windowed mode, icon) and runs PyInstaller underneath. Used to produce MatrixCalculator.exe from GUI.py and Main.py.',
    deps: ['pyinstaller'] },

  { id: 'pyinstaller', x: 1150, y: 470, layer: 'e', icon: '📦', title: 'PyInstaller',
    sub: 'Bundle Python + deps\ninto standalone binary', tag: 'Compiler',
    extra_class: 'compile-path',
    desc: 'PyInstaller analyses the import graph of GUI.py, collects all required modules (Main.py, CustomTkinter, CTkMessagebox, tkinter, CPython stdlib), and bundles them alongside a bootloader into a self-contained .exe. The bootloader extracts and runs the embedded Python interpreter at launch.',
    deps: ['bootloader', 'python_runtime', 'customtkinter', 'ctkmessagebox'] },

  { id: 'bootloader', x: 1150, y: 640, layer: 'e', icon: '🚀', title: 'PyInstaller Bootloader',
    sub: 'Embedded interpreter\nExtract → exec at runtime', tag: 'Bundled Runtime',
    extra_class: 'compile-path',
    desc: 'A small C binary compiled into the .exe by PyInstaller. At launch it extracts the bundled Python interpreter and all dependencies into a temp directory (_MEIPASS), then hands off execution to GUI.py. This is what makes the .exe self-contained with zero install requirements.',
    deps: [] },

  { id: 'exe', x: 1150, y: 840, layer: 'e', icon: '💾', title: 'MatrixCalculator.exe',
    sub: 'Standalone Windows binary\nNo Python install needed', tag: 'Output Binary',
    extra_class: 'compile-path',
    desc: 'The final packaged Windows executable produced by PyInstaller via auto-py-to-exe. Contains the bundled CPython interpreter, GUI.py, Main.py, CustomTkinter, CTkMessagebox, and all tkinter dependencies. Runs as a normal .exe — no Python installation required on the target machine.',
    deps: ['bootloader'] },
];

const edges = [
  { from: 'gui_py',          to: 'input_grid',      type: 'normal' },
  { from: 'gui_py',          to: 'op_buttons',      type: 'normal' },
  { from: 'gui_py',          to: 'output_box',      type: 'normal' },
  { from: 'gui_py',          to: 'main_py',         type: 'normal' },
  { from: 'gui_py',          to: 'customtkinter',   type: 'normal' },
  { from: 'gui_py',          to: 'ctkmessagebox',   type: 'normal' },
  { from: 'gui_py',          to: 'python_runtime',  type: 'normal' },
  { from: 'input_grid',      to: 'customtkinter',   type: 'normal' },
  { from: 'op_buttons',      to: 'customtkinter',   type: 'normal' },
  { from: 'op_buttons',      to: 'ctkmessagebox',   type: 'normal' },
  { from: 'output_box',      to: 'customtkinter',   type: 'normal' },
  { from: 'main_py',         to: 'op_add_sub',      type: 'normal' },
  { from: 'main_py',         to: 'op_mul',          type: 'normal' },
  { from: 'main_py',         to: 'op_det',          type: 'normal' },
  { from: 'main_py',         to: 'op_power',        type: 'normal' },
  { from: 'main_py',         to: 'python_runtime',  type: 'normal' },
  { from: 'op_power',        to: 'op_mul',          type: 'normal' },
  { from: 'customtkinter',   to: 'stdlib_tkinter',  type: 'normal' },
  { from: 'ctkmessagebox',   to: 'customtkinter',   type: 'normal' },
  { from: 'python_runtime',  to: 'pvm',             type: 'normal' },
  { from: 'python_runtime',  to: 'stdlib_tkinter',  type: 'normal' },
  { from: 'test_py',         to: 'python_runtime',  type: 'normal' },
  // Compile path (dashed)
  { from: 'auto_py_to_exe',  to: 'pyinstaller',     type: 'compile' },
  { from: 'pyinstaller',     to: 'python_runtime',  type: 'compile' },
  { from: 'pyinstaller',     to: 'customtkinter',   type: 'compile' },
  { from: 'pyinstaller',     to: 'ctkmessagebox',   type: 'compile' },
  { from: 'pyinstaller',     to: 'bootloader',      type: 'compile' },
  { from: 'bootloader',      to: 'exe',             type: 'compile' },
  { from: 'gui_py',          to: 'auto_py_to_exe',  type: 'compile' },
];

const layerColors = {
  a: getComputedStyle(document.documentElement).getPropertyValue('--accent-a').trim(),
  b: getComputedStyle(document.documentElement).getPropertyValue('--accent-b').trim(),
  c: getComputedStyle(document.documentElement).getPropertyValue('--accent-c').trim(),
  d: getComputedStyle(document.documentElement).getPropertyValue('--accent-d').trim(),
  e: getComputedStyle(document.documentElement).getPropertyValue('--accent-e').trim(),
  f: getComputedStyle(document.documentElement).getPropertyValue('--accent-f').trim(),
};

const canvasLabels = [
  { x: 370, y: 450, text: '← INTERPRETER PATH', color: 'rgba(0,230,118,0.45)' },
  { x: 1150, y: 185, text: 'COMPILE PATH →', color: 'rgba(255,77,109,0.45)' },
];

DependencyMap.init({ nodes, edges, layerColors, canvasLabels });
</script>
</body>
</html>
